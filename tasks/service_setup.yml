---

- name: Read /etc/subuid
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cat /etc/subuid | grep {{ openbao_user }}
    executable: /bin/bash
  register: subuids
  changed_when: false

- name: Read /etc/subgid
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cat /etc/subgid | grep {{ openbao_user }}
    executable: /bin/bash
  register: subgids
  changed_when: false

- name: Set owner and group
  ansible.builtin.set_fact:
    openbao_config_owner: "{{ openbao_user_id_map.openbao.uid + (subuids.stdout.split(':')[1] | int) - 1 }}"
    openbao_config_group: "{{ openbao_user_id_map.openbao.gid + (subgids.stdout.split(':')[1] | int) - 1 }}"

- name: Ensure directories for volumes exist
  become: true
  loop: "{{ openbao_volumes | dict2items }}"
  loop_control:
    loop_var: volume
    label: "{{ volume.key }}"
  when: not (volume.value.file | default(false))
  ansible.builtin.file:
    path: "{{ volume.value.host_path }}"
    state: directory
    owner: "{{ volume.value.owner }}"
    group: "{{ volume.value.group }}"
    mode: "{{ volume.value.permissions }}"

- name: Ensure .config/systemd/user directory exists
  become: true
  ansible.builtin.file:
    path: "{{ openbao_user_home }}/.config/containers/systemd"
    state: directory
    owner: "{{ openbao_user }}"
    group: "{{ openbao_user }}"
    mode: "0700"

- name: "Look up entry in passwd for user {{ openbao_user }}"
  become: true
  ansible.builtin.getent:
    database: passwd
    key: "{{ openbao_user }}"

- name: Set openbao user uid
  ansible.builtin.set_fact:
    openbao_uid: "{{ ansible_facts.getent_passwd[openbao_user][1] }}"

- name: Copy openbao config file
  become: true
  ansible.builtin.copy:
    src: "{{ openbao_config_file_src }}"
    dest: "{{ openbao_service_dir }}/config/openbao.hcl"
    owner: "{{ openbao_config_owner }}"
    group: "{{ openbao_config_group }}"
    mode: "0644"
  register: openbao_config_file_result

- name: Write root token encryption public key
  become: true
  when: open_bao_root_token_gpg_key is not none
  ansible.builtin.copy:
    content: "{{ open_bao_root_token_gpg_key }}"
    dest: "{{ openbao_volumes.config.host_path }}/root-token.pgp"
    owner: "{{ openbao_config_owner }}"
    group: "{{ openbao_config_group }}"
    mode: "0600"

- name: Write recovery key encryption public keys
  become: true
  when: open_bao_recovery_pgp_keys is not none
  loop: "{{ open_bao_recovery_pgp_keys }}"
  loop_control:
    loop_var: recovery_gpg_key
    label: "{{ recovery_gpg_key.name }}"
  ansible.builtin.copy:
    content: "{{ recovery_gpg_key.content }}"
    dest: "{{ openbao_volumes.config.host_path }}/{{ recovery_gpg_key.file_name }}"
    owner: "{{ openbao_config_owner }}"
    group: "{{ openbao_config_group }}"
    mode: "0600"

- name: Build recovery PGP key path list
  when: open_bao_recovery_pgp_keys is not none
  ansible.builtin.set_fact:
    openbao_recovery_pgp_key_paths: >-
      {{
        open_bao_recovery_pgp_keys
        | map(attribute='file_name')
        | map('regex_replace', '^',openbao_volumes.config.container_path ~ '/')
        | list
      }}

- name: Template openbao quadlet
  become: true
  ansible.builtin.template:
    src: openbao.container.j2
    dest: "{{ openbao_user_home }}/.config/containers/systemd/openbao.container"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_user }}"
    mode: "0640"
  register: openbaoquad_result

- name: Manage rootless openbao service
  become: true
  become_user: "{{ openbao_user }}"
  vars:
    # Overriding the become_user task keyword.
    # Effects even global overrides (like Foreman remote execution)
    ansible_become_user: "{{ openbao_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ openbao_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ openbao_uid }}/bus"
  block:
    - name: Check bao status
      containers.podman.podman_container_exec:
        name: "{{ openbao_container_name }}"
        env:
          BAO_ADDR: "{{ openbao_local_url }}"
        argv:
          - bao
          - status
          - -format=json
      register: bao_status
      failed_when: false
      changed_when: false

    - name: Create OpenBao seal secret
      when:
        - openbao_auto_unseal_type == "static"
        - openbao_auto_unseal_enabled
        - bao_status.rc != 0
      containers.podman.podman_secret:
        name: "{{ openbao_auto_unseal_key_name }}"
        data: "{{ openbao_auto_unseal_key }}"
        state: present
      no_log: true

    # creates /var/run/user/<uid>/systemd/generator/openbao.service
    - name: Start or restart openbao
      ansible.builtin.systemd_service:
        name: "{{ openbao_container_name }}.service"
        scope: user
        state: "{{ (openbaoquad_result.changed or openbao_config_file_result.changed) | ternary('restarted', 'started') }}"
        daemon_reload: true

    - name: Wait for OpenBao API
      ansible.builtin.uri:
        url: "{{ openbao_local_url }}/v1/sys/health"
        method: GET
        status_code: [200, 429, 472, 473, 501, 503]
      register: bao_health
      retries: 30
      delay: 2
      until: bao_health.status | default(0) in [200, 429, 472, 473, 501, 503]
      changed_when: false

    - name: Check bao status
      containers.podman.podman_container_exec:
        name: "{{ openbao_container_name }}"
        env:
          BAO_ADDR: "{{ openbao_local_url }}"
        argv:
          - bao
          - status
          - -format=json
      register: bao_status
      failed_when: bao_status.rc | default(1) not in [0, 2]  # rc=2 when sealed
      changed_when: false

    - name: Parse bao status
      ansible.builtin.set_fact:
        bao_status_json: "{{ bao_status.stdout | from_json }}"

    - name: Include initilization
      when: not bao_status_json.initialized
      ansible.builtin.include_tasks:
        file: initialize.yml

  always:
    - name: Remove OpenBao seal secret
      containers.podman.podman_secret:
        name: "{{ openbao_auto_unseal_key_name }}"
        state: absent
      no_log: true

...
